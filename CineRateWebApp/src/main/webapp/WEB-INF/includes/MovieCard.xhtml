<?xml version="1.0" encoding="UTF-8"?>
<!-- Carte d'un film (affiche, note, titre), utilisée dans Catalogue et MovieDetail - Klisman Kodra -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:link outcome="MovieDetail" styleClass="cr-card" title="#{movie.title}">
        <f:param name="id" value="#{movie.UUID}"/>
        <div class="cr-poster #{movieDisplay.tone(movie)}">
            <h:graphicImage value="#{movie.posterUrl}" alt="#{movie.title}"
                            rendered="#{movieDisplay.hasPoster(movie)}"/>
            <h:panelGroup styleClass="cr-poster-title" rendered="#{not movieDisplay.hasPoster(movie)}">#{movie.title}</h:panelGroup>
            <span class="cr-badge #{movieDisplay.isRated(movie) ? '' : 'is-new'}">&#9733; #{movieDisplay.rating(movie)}</span>
        </div>
        <div class="cr-card-body">
            <span class="cr-card-title">#{movie.title}</span>
            <span class="cr-card-meta">#{movie.releaseYear} &#183; #{movieDisplay.genres(movie)}</span>
        </div>
    </h:link>

</ui:composition>
