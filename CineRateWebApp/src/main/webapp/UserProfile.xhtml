<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="templates/UserTemplate.xhtml">

    <ui:define name="title">User | Profile</ui:define>

    <ui:define name="section-title">#{userBean.fullName} | Profile</ui:define>

    <ui:define name="section-content">
        <p:outputLabel for="@next" value="Basic Information"/>
        <h:form id="basicInfo">
            <p:outputLabel for="@next" value="First Name" style="font-size: 12px;"/><br/>
            <p:inputText id="firstname" value="#{userBean.firstName}" required="true"
                         requiredMessage="First name is required.">
                <p:ajax event="blur" update="basicInfo" listener="#{userBean.checkIfChanged()}"/>
                <p:ajax event="keyup" update="basicInfo" listener="#{userBean.checkIfChanged()}"/>
            </p:inputText>
            <p:message for="firstname" display="text"/>
            <br/>
            <p:outputLabel for="@next" value="Last Name" style="font-size: 12px;"/><br/>
            <p:inputText id="lastname" value="#{userBean.lastName}" required="true"
                         requiredMessage="Last name is required.">
                <p:ajax event="blur" update="basicInfo" listener="#{userBean.checkIfChanged()}"/>
                <p:ajax event="keyup" update="basicInfo" listener="#{userBean.checkIfChanged()}"/>
            </p:inputText>
            <p:message for="lastname" display="text"/>
            <br/>
            <p:outputLabel for="@next" value="Email" style="font-size: 12px;"/><br/>
            <p:inputText id="email" value="#{userBean.email}" required="true"
                         requiredMessage="Email is required." validatorMessage="Incorrect email.">
                <p:ajax event="blur" update="basicInfo" listener="#{userBean.checkIfChanged()}"/>
                <p:ajax event="keyup" update="basicInfo" listener="#{userBean.checkIfChanged()}"/>
                <f:validateRegex pattern="^[^@]+@[^@]+\.[^@]+$"/>
            </p:inputText>
            <p:message for="email" display="text"/>
            <br/>
            <p:outputLabel for="@next" value="Username" style="font-size: 12px;"/><br/>
            <p:inputText id="username" value="#{userBean.username}" required="true"
                         requiredMessage="Username is required.">
                <p:ajax event="blur" update="basicInfo" listener="#{userBean.checkIfChanged()}"/>
                <p:ajax event="keyup" update="basicInfo" listener="#{userBean.checkIfChanged()}"/>
            </p:inputText>
            <p:message for="username" display="text"/>
            <br/>
            <p:spacer height="30"/>
            <p:commandButton id="updateButton" value="Update" disabled="#{userBean.buttonDisabled}"
                             action="#{userBean.updateUser()}"
                             update="basicInfo"/>
            <p:spacer width="10"/>
            <p:commandButton id="undoButton" value="Undo" actionListener="#{userBean.undoChanges()}" immediate="true"
                             update="basicInfo" oncomplete="window.location.reload();"/>
            <p:dialog id="updateErrorDialog"
                      widgetVar="updateErrorDialog"
                      header="Update impossible"
                      modal="true"
                      resizable="true"
                      width="250"
                      height="50">
                <h:outputText id="updateErrorMessage" value="#{userBean.dialogMessage}"/>
            </p:dialog>
        </h:form>
        <br/>

        <p:outputLabel for="@next" value="Change Password"/>
        <h:form id="changePasswordForm">
            <p:outputLabel for="@next" value="Current Password" style="font-size: 12px;"/><br/>
            <p:password id="currentPassword" value="#{userBean.currentPassword}" autocomplete="new-password"
                        redisplay="true" toggleMask="true" feedback="false"
                        required="true" requiredMessage="Current password is required.">
                <p:ajax event="blur" update="changePasswordButton"/>
            </p:password>
            <p:message for="currentPassword" display="text"/>
            <br/>
            <p:outputLabel for="@next" value="New Password" style="font-size: 12px;"/><br/>
            <p:password id="newPassword" value="#{userBean.newPassword}" autocomplete="new-password"
                        redisplay="true" toggleMask="true" feedback="false"
                        required="true" requiredMessage="New password is required.">
                <p:ajax event="blur" update="changePasswordButton"/>
            </p:password>
            <p:message for="newPassword" display="text"/>
            <br/>
            <p:spacer height="30"/>
            <p:commandButton id="changePasswordButton" value="Save"
                             action="#{userBean.savePasswordChange()}"
                             update="changePasswordForm"/>
            <p:spacer width="10"/>
            <p:commandButton id="resetPasswordButton" value="Reset"
                             actionListener="#{userBean.resetPasswordChange()}" immediate="true"
                             update="changePasswordForm" oncomplete="window.location.reload();"/>
            <p:dialog id="passwordChangeDialog"
                      widgetVar="passwordChangeDialog"
                      header="Password Change"
                      modal="true"
                      resizable="true"
                      width="250"
                      height="50">
                <h:outputText id="passwordChangeMessage" value="#{userBean.dialogMessage}"/>
            </p:dialog>
        </h:form>
        <br/>

        <p:outputLabel for="@next" value="Delete Account"/>
        <h:form id="deleteAccountForm">
            <p:commandButton id="deleteButton" value="Delete my account" action="#{userBean.deleteUser()}">
                <p:confirm header="Delete Account" message="Do you really want to delete your account?"/>
            </p:commandButton>
            <p:confirmDialog global="true">
                <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes"/>
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no"/>
            </p:confirmDialog>
        </h:form>
    </ui:define>

</ui:composition>

</html>
